  mesaj: Rabbimiz Özdemir beye rahmeti magfireti ile muamele eylesin. Amin. ...Annem 95 yaşında iki gündur Merhum Özdemir bey için dua ediyor. Bizler evlatlar olarak Onun dualarına alışığız. Her Gün balkondan Külliye ye bakar , dakikalarca Cumhurbaşkanımıza da devamlı dua eder. Bu defa dikkatimi çekti. Sebebini sordum. Oğlum bu adam Selçuk isminde vatanına faydalı hayırlı bir evlat yetiştirmiş. Ne mutlu ona ve hanımına. Bu beyefendi Nur içinde yatsın mekanı cennet olsun. Peygamberimize komşu olsun. Onun evladının ve Tayyib oğlumun muvaffakiyeti için , onlarla beraber çalışanlarin başarısı için dua ediyorum. Elimden ancak dua etmek geliyor. Dedikten sonra Tayyip bey zamanımızın Sultan Abdülhamid i gibi. Ona düşman olanlar bugün Tayyib oğluma düşmanlık yapıyorlar. Kaderi benzemez insaallah. ....Bunun için dua ediyorum dedi . Duygulandım. Gözlerim yaşardı elini öptüm. Bu tesbitine bu şuurlu izahatına hayret ettim. Zaman zaman dimaginda duraklama olsa da Maaşaallah Anadolu irfanı böyle bir sey. Özdemir beyin vefatı vesilesi ile Annem ile aramızda geçen bu muhavere yi sizlerle paylaşmak istedim. Tekrar siz evlatlarına ve sevenlerine taziyelerimizi bildirir, Sabri cemil dileriz. Meryem Temizkök ve oğlu Ahmet
