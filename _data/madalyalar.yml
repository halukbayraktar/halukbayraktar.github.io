  aciklama: "Burkina Faso'nun barış ve güvenliğine, terörle mücadelesine katkılarından dolayı ülkenin en üst ulusal nişanı, Cumhurbaşkanı talimatıyla Büyük Şansölye Sem André Rock Compaoré tarafından tevcih edildi."
  hakkinda: "Aygır Nişanı (Ordre de l'Étalon), Burkina Faso'nun en yüksek devlet nişanıdır. Ülkeye yapılan üstün sivil ve askeri hizmetleri ödüllendirir; Officier (Subay) derecesi nişanın üst kademelerindendir."
