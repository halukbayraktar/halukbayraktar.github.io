- ad: "1. Derece Ukrayna Ulusal Güvenlik ve Savunma Konseyi Nişanı"
  tarih: "2024-05-28"
  ulke: Ukrayna
  foto: [ugsk-1.jpg, ugsk-2.jpg]
  aciklama: "Ukrayna'nın ulusal güvenliğine, savunmasına ve sıkıyönetim altında savunma kabiliyetinin geliştirilmesine yaptığı önemli katkılardan dolayı Ukrayna Ulusal Güvenlik ve Savunma Konseyi Sekreteri tarafından takdim edildi."
  hakkinda: "Nişan, Ukrayna Ulusal Güvenlik ve Savunma Konseyi Sekreteri Oleksandr Lytvynenko'nun 22 Mayıs 2024 tarihli ve 78/2024 sayılı kararıyla verildi; tören 28 Mayıs 2024'te yapıldı."
