name: Kamara Telegram bildirimi
on:
  push:
    branches: [master]
    paths: ['kamara/index.html', 'kamara/manset.txt']
  workflow_dispatch:
jobs:
  bildir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sitenin yayına girmesini bekle
        if: github.event_name == 'push'
        run: sleep 150
      - name: Linki gönder (Telegram ve Tekir)
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEKIR_API_URL: ${{ secrets.TEKIR_API_URL }}
          TEKIR_TOKEN: ${{ secrets.TEKIR_BOT_TOKEN }}
          TEKIR_CHAT: ${{ secrets.TEKIR_CHAT_ID }}
        run: |
          TARIH=$(TZ=Europe/Istanbul date +%Y-%m-%d)
          MANSET=$(head -c 300 kamara/manset.txt 2>/dev/null || true)
          METIN=$(printf "📰 Haluk'un Kamarası · %s\n%s\n\nhttps://halukbayraktar.github.io/kamara/?g=%s" "$TARIH" "$MANSET" "$TARIH")
          google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars --force-device-scale-factor=2 \
            --window-size=440,900 --screenshot=/tmp/kapak.png "file://$PWD/kamara/index.html" >/dev/null 2>&1 || true

          # gonder AD API_TABANI SOHBET METIN  (API_TABANI: .../bot<anahtar>, Telegram Bot API ile aynı biçim)
          gonder() {
            if [ -s /tmp/kapak.png ] && curl -sS --fail -o /dev/null -X POST "$2/sendPhoto" \
                 -F "chat_id=$3" -F "photo=@/tmp/kapak.png" -F "caption=$4"; then
              echo "$1: resimli mesaj gönderildi."
            elif curl -sS --fail -o /dev/null -X POST "$2/sendMessage" \
                 --data-urlencode "chat_id=$3" --data-urlencode "text=$4"; then
              echo "$1: mesaj gönderildi (resimsiz)."
            else
              echo "$1: gönderilemedi."; return 1
            fi
          }

          HATA=0
          if [ -n "$TOKEN" ]; then
            EK=""
            if [ -z "$CHAT" ]; then
              CHAT=$(curl -sS "https://api.telegram.org/bot${TOKEN}/getUpdates" | python3 -c "import sys,json; r=json.load(sys.stdin).get('result',[]); ids=[u['message']['chat']['id'] for u in r if 'message' in u]; print(ids[-1] if ids else '')")
              if [ -n "$CHAT" ]; then echo "::add-mask::$CHAT"; EK=$(printf "\n\nKurulum notu: sohbet numaranız %s." "$CHAT"); fi
            fi
            if [ -n "$CHAT" ]; then gonder "Telegram" "https://api.telegram.org/bot${TOKEN}" "$CHAT" "${METIN}${EK}" || HATA=1
            else echo "Telegram: sohbet bulunamadı."; HATA=1; fi
          else
            echo "Telegram: ayarlar eksik, atlandı."
          fi

          if [ -n "$TEKIR_API_URL" ] && [ -n "$TEKIR_TOKEN" ] && [ -n "$TEKIR_CHAT" ]; then
            gonder "Tekir" "${TEKIR_API_URL%/}/bot${TEKIR_TOKEN}" "$TEKIR_CHAT" "$METIN" || HATA=1
          else
            echo "Tekir: ayarlar eksik, atlandı."
          fi
          exit $HATA
