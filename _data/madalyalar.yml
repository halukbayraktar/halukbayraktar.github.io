- ad: "Etiyopya Federal Demokratik Cumhuriyeti Onur Madalyası"
  tarih: "2023-12-16"
  ulke: Etiyopya
  aciklama: "Etiyopya'nın ulusal ve hava kuvvetleri kapasitesinin geliştirilmesine katkılarından dolayı verildi. Madalya, Etiyopya Hava Kuvvetleri'nin 88. kuruluş yıl dönümünde Addis Ababa'daki törende Başbakan Abiy Ahmed Ali'nin huzurunda takdim edildi."
