<!doctype html>
<html lang="tr">
<head>

<meta name="description" content="{{ page.description | default: site.description }}">
<meta property="og:title" content="{{ page.title | default: site.title }}">
<meta property="og:image" content="{{ site.url }}/images/halukprofil.jpg">
<link rel="icon" href="/images/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
</head>
<body>
<div class="wrap">
<header class="top">
  <a class="brand" href="/">Haluk'un Kamarası</a>
  <nav><a href="/en/profile/">Hakkında</a><a href="/makaleler/">Makaleler</a><a href="/paylasimlar/">Paylaşımlar</a><a href="/gorsel-yayinlar/">Görsel Yayınlar</a><a href="/madalyalar/">Madalyalar</a><a href="/ozdemir-bayraktar/">Özdemir Bayraktar</a><a href="/iletisim/">Bana Ulaşın</a><a href="?lang=en" class="dil-link notranslate" lang="en" translate="no">English</a></nav>
</header>
{{ content }}
<footer><span>© {{ site.time | date: "%Y" }} Haluk Bayraktar</span><nav class="sosyal" aria-label="Sosyal medya">
  <a href="https://x.com/haluk" title="X (Twitter) · @haluk" aria-label="X"><svg viewBox="0 0 24 24"><path d="M18.9 2H22l-6.8 7.8L23 22h-6.2l-4.9-6.4L6.3 22H3.2l7.3-8.3L1 2h6.4l4.4 5.8L18.9 2zm-1.1 18h1.7L6.3 3.9H4.5L17.8 20z"/></svg></a>
  <a href="https://nsosyal.com/halukbayraktar" title="NSosyal · @halukbayraktar" aria-label="NSosyal"><svg viewBox="0 0 24 24"><path d="M5 3h4.2l5.6 9.6V3H19v18h-4.2L9.2 11.4V21H5z"/></svg></a>
  <a href="https://www.linkedin.com/in/halukbayraktar" title="LinkedIn" aria-label="LinkedIn"><svg viewBox="0 0 24 24"><path d="M4.98 3.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5zM3 9.5h4V21H3zM9.5 9.5h3.8v1.6h.1c.5-1 1.8-2 3.8-2 4 0 4.8 2.6 4.8 6V21h-4v-5.1c0-1.2 0-2.8-1.7-2.8s-2 1.3-2 2.7V21h-4z"/></svg></a>
</nav><a href="#">Yukarı ↑</a></footer>
</div>
<button id="dil" class="dil notranslate" translate="no" type="button" aria-label="English / Türkçe">EN</button>
<div id="google_translate_element" hidden></div>
<script>
(function(){
  function cerez(){var m=document.cookie.match(/googtrans=\/tr\/(\w+)/);return m?m[1]:'tr';}
  function yaz(v){
    var h=location.hostname, s=v?'/tr/'+v:'', e=v?'':'; expires=Thu, 01 Jan 1970 00:00:00 GMT';
    document.cookie='googtrans='+s+'; path=/'+e;
    document.cookie='googtrans='+s+'; path=/; domain=.'+h+e;
  }
  var q=new URLSearchParams(location.search).get('lang');
  if(q==='en'&&cerez()!=='en'){yaz('en');location.replace(location.pathname+location.hash);return;}
  if(q==='tr'&&cerez()==='en'){yaz('');location.replace(location.pathname+location.hash);return;}
  var b=document.getElementById('dil'), en=cerez()==='en';
  function cevir(ev){if(ev)ev.preventDefault();yaz(en?'':'en');location.reload();}
  b.textContent=en?'TR':'EN';
  b.onclick=cevir;
  document.querySelectorAll('.dil-link').forEach(function(a){a.textContent=en?'Türkçe':'English';a.href=en?'?lang=tr':'?lang=en';a.onclick=cevir;});
  if(en){
    window.gtInit=function(){new google.translate.TranslateElement({pageLanguage:'tr',includedLanguages:'en',autoDisplay:false},'google_translate_element');};
    var sc=document.createElement('script');sc.src='https://translate.google.com/translate_a/element.js?cb=gtInit';document.head.appendChild(sc);
  }
})();
</script>
</body>
</html>
