- ad: "1. Derece Devlet Liyakat Nişanı"
  tarih: "2022-08-23"
  ulke: Ukrayna
  foto: [n-ukrayna-liyakat-1.jpg, liyakat-1-1.jpg]
  aciklama: "Devletlerarası işbirliğine, Ukrayna'nın egemenliğine ve toprak bütünlüğüne katkılarından dolayı Cumhurbaşkanı Volodimir Zelenski tarafından verildi. Ukrayna tarihinde bu en üst seviye nişanı alan ilk Türk vatandaşıdır."
  hakkinda: "Liyakat Nişanı (Orden «Za zasluhy»), 22 Eylül 1996'da kurulan ve ekonomi, bilim, kültür, askeri ve siyasi alanlarda üstün başarılar için verilen Ukrayna devlet nişanıdır. Üç derecesi vardır; 1. derece en yükseğidir. Nişan, Cumhurbaşkanı'nın 595/2022 sayılı kararnamesiyle verildi."
