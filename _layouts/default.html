<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<meta property="og:title" content="{{ page.title | default: site.title }}">
<meta property="og:image" content="{{ site.url }}/images/halukprofil.jpg">
<link rel="icon" href="/images/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
</head>
<body>
<div class="wrap">
<header class="top">
  <a class="brand" href="/">Haluk'un Kamarası</a>
  <nav><a href="/en/profile/">Hakkında</a><a href="/#makaleler">Makaleler</a><a href="/paylasimlar/">Paylaşımlar</a><a href="/madalyalar/">Madalyalar</a><a href="/ozgecmis/">Özgeçmiş</a><a href="/ozdemir-bayraktar/">Özdemir Bayraktar</a><a href="/iletisim/">Bana Ulaşın</a><a href="?lang=en" class="dil-link notranslate" lang="en" translate="no">English</a></nav>
</header>
{{ content }}
<footer><span>© {{ site.time | date: "%Y" }} Haluk Bayraktar</span><a href="#">Yukarı ↑</a></footer>
</div>
<button id="dil" class="dil notranslate" translate="no" type="button" aria-label="English / Türkçe">EN</button>
<div id="google_translate_element" hidden></div>
<script>
(function(){
  function cerez(){var m=document.cookie.match(/googtrans=\/tr\/(\w+)/);return m?m[1]:'tr';}
  function yaz(v){
    var h=location.hostname, s=v?'/tr/'+v:'', e=v?'':'; expires=Thu, 01 Jan 1970 00:00:00 GMT';
    document.cookie='googtrans='+s+'; path=/'+e;
    document.cookie='googtrans='+s+'; path=/; domain=.'+h+e;
  }
  var q=new URLSearchParams(location.search).get('lang');
  if(q==='en'&&cerez()!=='en'){yaz('en');location.replace(location.pathname+location.hash);return;}
  if(q==='tr'&&cerez()==='en'){yaz('');location.replace(location.pathname+location.hash);return;}
  var b=document.getElementById('dil'), en=cerez()==='en';
  function cevir(ev){if(ev)ev.preventDefault();yaz(en?'':'en');location.reload();}
  b.textContent=en?'TR':'EN';
  b.onclick=cevir;
  document.querySelectorAll('.dil-link').forEach(function(a){a.textContent=en?'Türkçe':'English';a.href=en?'?lang=tr':'?lang=en';a.onclick=cevir;});
  if(en){
    window.gtInit=function(){new google.translate.TranslateElement({pageLanguage:'tr',includedLanguages:'en',autoDisplay:false},'google_translate_element');};
    var sc=document.createElement('script');sc.src='https://translate.google.com/translate_a/element.js?cb=gtInit';document.head.appendChild(sc);
  }
})();
</script>
</body>
</html>
