name: Kamara bildirimi (Telegram + Tekir)
on:
  push:
    branches: [master]
    paths: ['kamara/index.html', 'kamara/manset.txt']
  workflow_dispatch:
jobs:
  bildir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sitenin yayına girmesini bekle
        if: github.event_name == 'push'
        run: sleep 150
      - name: Linki gönder (Telegram ve Tekir)
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEKIR_API_URL: ${{ secrets.TEKIR_API_URL }}
          TEKIR_TOKEN: ${{ secrets.TEKIR_BOT_TOKEN }}
          TEKIR_CHAT: ${{ secrets.TEKIR_CHAT_ID }}
        run: |
          TARIH=$(TZ=Europe/Istanbul date +%Y-%m-%d)
          MANSET=$(head -c 300 kamara/manset.txt 2>/dev/null || true)
          METIN=$(printf "📰 Haluk'un Kamarası · %s\n%s\n\nhttps://halukbayraktar.github.io/kamara/?g=%s" "$TARIH" "$MANSET" "$TARIH")
          google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars --force-device-scale-factor=2 \
            --window-size=440,900 --screenshot=/tmp/kapak.png "file://$PWD/kamara/index.html" >/dev/null 2>&1 || true

          # gonder AD API_TABANI SOHBET METIN  (API_TABANI: .../bot<anahtar>, Telegram Bot API ile aynı biçim)
          # Yanıt gövdesindeki "ok" alanına bakar; hata olursa API'nin açıklamasını yazar (kimlik bilgisi yazmaz).
          sonuc() { python3 -c "import sys,json
          try:
              d=json.load(open('/tmp/yanit.json'))
          except Exception as e:
              print('HATA yanıt okunamadı'); sys.exit(1)
          if d.get('ok'): print('OK'); sys.exit(0)
          print('HATA', d.get('error_code'), d.get('description')); sys.exit(1)"; }
          gonder() {
            if [ -s /tmp/kapak.png ]; then
              curl -sS -m 60 -o /tmp/yanit.json -X POST "$2/sendPhoto" -F "chat_id=$3" -F "photo=@/tmp/kapak.png" -F "caption=$4" || true
              R=$(sonuc) && { echo "$1: resimli mesaj gönderildi."; return 0; } || echo "$1: resimli gönderim başarısız -> $R"
            fi
            curl -sS -m 60 -o /tmp/yanit.json -X POST "$2/sendMessage" --data-urlencode "chat_id=$3" --data-urlencode "text=$4" || true
            R=$(sonuc) && { echo "$1: mesaj gönderildi (resimsiz)."; return 0; } || { echo "$1: gönderilemedi -> $R"; return 1; }
          }

          HATA=0
          if [ -n "$TOKEN" ]; then
            EK=""
            if [ -z "$CHAT" ]; then
              CHAT=$(curl -sS "https://api.telegram.org/bot${TOKEN}/getUpdates" | python3 -c "import sys,json; r=json.load(sys.stdin).get('result',[]); ids=[u['message']['chat']['id'] for u in r if 'message' in u]; print(ids[-1] if ids else '')")
              if [ -n "$CHAT" ]; then echo "::add-mask::$CHAT"; EK=$(printf "\n\nKurulum notu: sohbet numaranız %s." "$CHAT"); fi
            fi
            if [ -n "$CHAT" ]; then gonder "Telegram" "https://api.telegram.org/bot${TOKEN}" "$CHAT" "${METIN}${EK}" || HATA=1
            else echo "Telegram: sohbet bulunamadı."; HATA=1; fi
          else
            echo "Telegram: ayarlar eksik, atlandı."
          fi

          if [ -n "$TEKIR_TOKEN" ]; then
            TABAN=""
            for A in "$TEKIR_API_URL" https://api.tekir.app https://tekir.app https://bot.tekir.app https://botapi.tekir.app https://tekir.app/api; do
              [ -z "$A" ] && continue
              if curl -sS -m 15 "${A%/}/bot${TEKIR_TOKEN}/getMe" 2>/dev/null | grep -q '"ok":true'; then TABAN="${A%/}"; break; fi
            done
            if [ -z "$TABAN" ]; then
              echo "Tekir: bot API adresi bulunamadı (denenen adreslerin hiçbiri yanıt vermedi)."; HATA=1
            else
              echo "Tekir: API adresi $TABAN"
              EK=""
              if [ -z "$TEKIR_CHAT" ]; then
                curl -sS -m 15 -o /tmp/upd.json "$TABAN/bot${TEKIR_TOKEN}/getUpdates" || true
                python3 -c "import json; r=json.load(open('/tmp/upd.json')).get('result',[]); m=[u['message'] for u in r if 'message' in u]; print('Tekir tanı: güncelleme', len(r), '· mesaj', len(m), '· farklı sohbet', len({x['chat']['id'] for x in m}), '· türler', sorted({x['chat'].get('type','?') for x in m}))" 2>/dev/null || echo "Tekir tanı: getUpdates okunamadı"
                TEKIR_CHAT=$(python3 -c "import json; r=json.load(open('/tmp/upd.json')).get('result',[]); ids=[u['message']['chat']['id'] for u in r if 'message' in u and u['message']['chat'].get('type')=='private']; print(ids[-1] if ids else '')" 2>/dev/null || true)
                if [ -n "$TEKIR_CHAT" ]; then echo "::add-mask::$TEKIR_CHAT"; EK=$(printf "\n\nKurulum notu: Tekir sohbet numaranız %s. Bu sayıyı Claude'a yazın." "$TEKIR_CHAT"); fi
              fi
              if [ -n "$TEKIR_CHAT" ]; then
                gonder "Tekir" "$TABAN/bot${TEKIR_TOKEN}" "$TEKIR_CHAT" "${METIN}${EK}" || HATA=1
                # Tekir resim altı yazısını göstermeyebilir: linki ayrıca düz mesaj olarak da gönder.
                curl -sS -m 60 -o /tmp/yanit.json -X POST "$TABAN/bot${TEKIR_TOKEN}/sendMessage" --data-urlencode "chat_id=$TEKIR_CHAT" --data-urlencode "text=${METIN}" || true
                R=$(sonuc) && echo "Tekir: link ayrı mesaj olarak gönderildi." || { echo "Tekir: link mesajı gönderilemedi -> $R"; HATA=1; }
              else echo "Tekir: sohbet bulunamadı, önce bota bir mesaj yazın."; HATA=1; fi
            fi
          else
            echo "Tekir: anahtar eksik, atlandı."
          fi
          exit $HATA
