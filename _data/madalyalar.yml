# Madalya ve nişanlar: yeniden eskiye. Kaynak: madalya dosyası ve Vikipedi. foto: ilk görsel madalyanın kendisi.
- ad: "Sudan İki Nil Nişanı"
  tarih: "2026-09-17"
  ulke: Sudan
  foto: [sudan-3.jpg, sudan-1.jpg, sudan-2.jpg]
  aciklama: "Sudan Egemenlik Konseyi Başkanı Abdulfettah el-Burhan tarafından takdim edildi."
  hakkinda: "İki Nil Nişanı (Beyaz ve Mavi Nil), 16 Kasım 1961'de kurulan ve Cumhuriyet Nişanı'ndan sonra Sudan'ın ikinci en yüksek devlet nişanıdır. Devlete büyük hizmetlerde bulunan Sudanlı ve yabancı, sivil ve asker kişilere verilir; beş derecesi vardır."
- ad: "Sarauniya Mangou Egemenlik Madalyası"
  tarih: "2025-08-05"
  ulke: Nijer
  foto: [n-nijer.jpg]
  aciklama: "Baykar'ın Nijer devletine bugüne kadar verdiği destekten ötürü Devlet Başkanı Abdourahmane Tiani tarafından takdim edildi. Madalya, ulusal egemenlik uğruna vatanseverlik, özveri ve fedakârlık eylemleriyle öne çıkan kişi ve kurumlara verilir."
  hakkinda: "Madalya 23 Mayıs 2024'te kuruldu. Adını, 1899'da Fransız sömürge seferine karşı halkını savunan Azna kraliçesi Sarraounia Mangou'dan alır. Kurdelesi Nijer bayrağının turuncu, beyaz ve yeşil renklerinden oluşur."
